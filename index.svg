<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%" viewBox="0 0 1920 1080">
  <foreignObject id="fo" width="1920" height="1080" x="0" y="0">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;">
    <xhtml:head>
      <xhtml:title>M1sch1ef</xhtml:title>
      <xhtml:style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0c10; color: #c5c6c7; }
        
        .container { display: flex; width: 100vw; height: 100vh; }
        
        /* Navigation Sidebar */
        .sidebar { width: 260px; background: #1f2833; display: flex; flex-direction: column; border-right: 2px solid #45f3ff; padding: 20px; }
        .brand { font-size: 24px; font-weight: bold; color: #45f3ff; text-align: center; margin-bottom: 40px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(69,243,255,0.3); }
        .nav-btn { background: transparent; border: 1px solid transparent; color: #c5c6c7; padding: 12px 20px; text-align: left; font-size: 16px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: all 0.3s ease; }
        .nav-btn:hover, .nav-btn.active { background: #45f3ff; color: #0b0c10; font-weight: bold; box-shadow: 0 0 15px rgba(69,243,255,0.4); }
        
        /* Main Display Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: #0b0c10; }
        .tab-content { display: none; width: 100%; height: 100%; padding: 30px; overflow-y: auto; }
        .tab-content.active { display: block; }
        
        /* Elements inside tabs */
        h2 { color: #45f3ff; margin-bottom: 20px; font-size: 28px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #1f2833; border: 1px solid #2f3b4c; border-radius: 12px; padding: 20px; text-align: center; transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); border-color: #45f3ff; }
        .card a { color: #fff; text-decoration: none; font-weight: bold; display: block; width: 100%; height: 100%; }
        
        /* Game View Frame */
        #game-container { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: absolute; top: 15px; right: 15px; background: #ff4757; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; z-index: 100; }
      </xhtml:style>
    </xhtml:head>
    <xhtml:body>
      
      <div class="container">
        <div class="sidebar">
          <div class="brand">M1sch1ef</div>
          <button class="nav-btn active" onclick="switchTab('games')">Games</button>
          <button class="nav-btn" onclick="switchTab('partners')">Partners</button>
          <button class="nav-btn" onclick="switchTab('links')">Links</button>
        </div>

        <div class="main-content">
          
          <div id="game-container">
            <button class="back-btn" onclick="closeGame()">✕ Close Game</button>
            <iframe id="game-frame" src="about:blank"></iframe>
          </div>

          <div id="games" class="tab-content active">
            <h2>GN Math Games</h2>
            <div class="grid">
              <div class="card" onclick="loadGame('https://cdn.jsdelivr.net/gh/soonicdatguy/allinone@gnmath/singlefile.html')">
                <h3>Launch All-In-One</h3>
                <p style="font-size:12px; color:#888; margin-top:8px;">Click to load the GN Math directory</p>
              </div>
            </div>
          </div>

          <div id="partners" class="tab-content">
            <h2>Our Partners</h2>
            <div class="grid">
              <div class="card">
                <a href="https://classroomspot.github.io" target="_blank">Classroomspot</a>
              </div>
              <div class="card">
                <a href="https://dsc.gg/unknownbasement" target="_blank">Unknown Hub</a>
              </div>
            </div>
          </div>

          <div id="links" class="tab-content">
            <h2>Links</h2>
            <p style="color:#888;">Content placeholder. (Provide your specific links later to populate this section).</p>
          </div>

        </div>
      </div>

      <xhtml:script>
      //<![CDATA[
        // Viewport handling
        function size() {
          var w = window.innerWidth, h = window.innerHeight;
          var svg = document.querySelector('svg');
          var fo  = document.querySelector('foreignObject');
          if (svg) { svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox','0 0 '+w+' '+h); }
          if (fo)  { fo.setAttribute('width', w);  fo.setAttribute('height', h); }
        }
        size();
        window.addEventListener('resize', size);

        // Tab Switching Logic
        function switchTab(tabId) {
          closeGame();
          document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
          document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
          
          document.getElementById(tabId).classList.add('active');
          event.currentTarget.classList.add('active');
        }

        // Inline Game Loader Logic
        function loadGame(url) {
          const container = document.getElementById('game-container');
          const frame = document.getElementById('game-frame');
          frame.src = url;
          container.style.display = 'block';
        }

        function closeGame() {
          const container = document.getElementById('game-container');
          const frame = document.getElementById('game-frame');
          frame.src = 'about:blank';
          container.style.display = 'none';
        }

        // "Are you sure you want to leave?" Tab Closure Prevention
        window.addEventListener('beforeunload', function (e) {
          e.preventDefault();
          e.returnValue = 'Are you sure you want to exit M1sch1ef?';
          return e.returnValue;
        });
      //]]>
      </xhtml:script>
    </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%" viewBox="0 0 1920 1080">
  <foreignObject id="fo" width="1920" height="1080" x="0" y="0">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;">
    <xhtml:head>
      <xhtml:title>M1sch1ef</xhtml:title>
      <xhtml:style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #313338; color: #dbdee1; }
        
        .app-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Left Server/Feature Bar */
        .guild-sidebar { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
        .guild-icon { width: 48px; height: 48px; background: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: border-radius 0.2s, background-color 0.2s; text-decoration: none; }
        .guild-icon:hover { border-radius: 16px; background: #4752c4; }
        
        /* Channels Sidebar */
        .channel-sidebar { width: 240px; background: #2b2d31; display: flex; flex-direction: column; }
        .server-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; padding: 0 16px; font-weight: bold; color: #f2f3f5; font-size: 16px; }
        .channel-list { padding: 8px; flex: 1; }
        .channel-btn { width: 100%; background: transparent; border: none; color: #949ba4; padding: 6px 8px; text-align: left; font-size: 15px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; display: flex; align-items: center; transition: background-color 0.1s, color 0.1s; }
        .channel-btn::before { content: "# "; font-size: 18px; color: #80848e; margin-right: 6px; }
        .channel-btn:hover, .channel-btn.active { background: #35373c; color: #f2f3f5; }
        .channel-btn.active::before { color: #dbdee1; }
        
        /* Chat Main Workspace */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #313338; position: relative; }
        .chat-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .chat-header-title { font-weight: bold; color: #f2f3f5; display: flex; align-items: center; }
        .chat-header-title::before { content: "#"; font-size: 20px; color: #80848e; margin-right: 8px; }
        
        /* Actions */
        .action-container { display: flex; gap: 8px; }
        .action-btn { background: #4e5058; color: #f2f3f5; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
        .action-btn:hover { background: #6d6f78; }
        
        /* Content Display Panels */
        .chat-scroller { flex: 1; padding: 16px; overflow-y: auto; display: none; }
        .chat-scroller.active { display: block; }
        
        /* Messages Layout */
        .msg-row { display: flex; margin-bottom: 20px; gap: 16px; }
        .avatar { width: 40px; height: 40px; background: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 18px; flex-shrink: 0; }
        .msg-content { flex: 1; }
        .msg-author { font-weight: 500; color: #f2f3f5; margin-bottom: 4px; display: inline-block; margin-right: 8px; }
        .msg-bot-tag { background: #5865f2; color: white; font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: bold; text-transform: uppercase; vertical-align: middle; }
        .msg-text { color: #dbdee1; line-height: 1.375rem; font-size: 15px; }
        
        /* Dynamic App Wrapper (Replaces IFrames entirely) */
        #app-injection-zone { display: none; flex: 1; width: 100%; height: calc(100% - 48px); background: #000; }
        #app-viewport { width: 100%; height: 100%; border: none; }
        
        /* Card Links */
        .chat-card { background: #2b2d31; border: 1px solid #1e1f22; border-radius: 8px; padding: 12px; margin-top: 8px; display: inline-block; min-width: 300px; text-decoration: none; color: inherit; transition: background-color 0.2s; }
        .chat-card:hover { background: #35373c; border-color: #5865f2; }
        .card-title { color: #00a8fc; font-weight: 600; margin-bottom: 4px; }
        .card-desc { font-size: 13px; color: #b5bac1; }
      </xhtml:style>
    </xhtml:head>
    <xhtml:body>
      
      <div class="app-container">
        <div class="guild-sidebar">
          <a class="guild-icon" href="#">M1</a>
        </div>

        <div class="channel-sidebar">
          <div class="server-header">M1sch1ef Workspace</div>
          <div class="channel-list">
            <button class="channel-btn active" id="btn-games" onclick="switchView('games')">gn-math-games</button>
            <button class="channel-btn" id="btn-partners" onclick="switchView('partners')">partners</button>
            <button class="channel-btn" id="btn-links" onclick="switchView('links')">links</button>
            <button class="channel-btn" id="btn-socials" onclick="switchView('socials')">socials</button>
          </div>
        </div>

        <div class="chat-area">
          <div class="chat-header">
            <div class="chat-header-title" id="current-header-title">gn-math-games</div>
            <div class="action-container" id="header-actions" style="display:none;">
              <button class="action-btn" onclick="popOutGame()">↗ Pop Out</button>
              <button class="action-btn" onclick="openNewTab()">🌐 Open In New Tab</button>
              <button class="action-btn" style="background:#da373c;" onclick="unloadGameSystem()">✕ Unload</button>
            </div>
          </div>

          <div id="app-injection-zone">
             <iframe id="app-viewport" src="about:blank"></iframe>
          </div>

          <div id="view-games" class="chat-scroller active">
            <div class="msg-row">
              <div class="avatar" style="background:#3ba55c;">SYS</div>
              <div class="msg-content">
                <span class="msg-author">System Terminal</span><span class="msg-bot-tag">SYSTEM</span>
                <div class="msg-text">
                  Welcome to the game portal. Click the application link below to inject the system scripts directly into the active viewport core.
                  <br />
                  <div class="chat-card" style="cursor:pointer;" onclick="launchGameSystem()">
                    <div class="card-title">🚀 Click to Initialize Game Client</div>
                    <div class="card-desc">Assembles full file structures from unblocked raw source.</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="view-partners" class="chat-scroller">
            <div class="msg-row">
              <div class="avatar" style="background:#5865f2;">PRT</div>
              <div class="msg-content">
                <span class="msg-author">Partners Registry</span>
                <div class="msg-text">
                  Official verified partnerships connected directly to the M1sch1ef node:
                  <br />
                  <a class="chat-card" href="https://classroomspot.github.io" target="_blank">
                    <div class="card-title">Classroomspot</div>
                    <div class="card-desc">classroomspot.github.io — Visit partner instance</div>
                  </a>
                  <br />
                  <a class="chat-card" href="https://dsc.gg/unknownbasement" target="_blank">
                    <div class="card-title">Unknown Hub</div>
                    <div class="card-desc">dsc.gg/unknownbasement — Connect directly</div>
                  </a>
                </div>
              </div>
            </div>
          </div>

          <div id="view-links" class="chat-scroller">
            <div class="msg-row">
              <div class="avatar">LNK</div>
              <div class="msg-content">
                <span class="msg-author">Links Hub</span>
                <div class="msg-text">Waiting for input configurations... (Provide your links later to update this register).</div>
              </div>
            </div>
          </div>

          <div id="view-socials" class="chat-scroller">
            <div class="msg-row">
              <div class="avatar" style="background:#eb459e;">SOC</div>
              <div class="msg-content">
                <span class="msg-author">Social Networks</span>
                <div class="msg-text">
                  Keep updated on official external configurations through our media channels:
                  <br />
                  <a class="chat-card" href="https://www.tiktok.com/@bananatheone" target="_blank">
                    <div class="card-title">My TikTok!</div>
                    <div class="card-desc">@bananatheone — Follow on TikTok</div>
                  </a>
                  <br />
                  <a class="chat-card" href="https://dsc.gg/m1sch1ef" target="_blank">
                    <div class="card-title">My Discord Server!</div>
                    <div class="card-desc">dsc.gg/m1sch1ef — Connect to the Discord Server community hub</div>
                  </a>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <xhtml:script>
      //<![CDATA[
        const TARGET_SOURCE = 'https://cdn.jsdelivr.net/gh/soonicdatguy/allinone@gnmath/singlefile.html';

        function size() {
          var w = window.innerWidth, h = window.innerHeight;
          var svg = document.querySelector('svg');
          var fo  = document.querySelector('foreignObject');
          if (svg) { svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox','0 0 '+w+' '+h); }
          if (fo)  { fo.setAttribute('width', w);  fo.setAttribute('height', h); }
        }
        size();
        window.addEventListener('resize', size);

        function switchView(target) {
          // Manage UI Tabs
          document.querySelectorAll('.chat-scroller').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.channel-btn').forEach(el => el.classList.remove('active'));
          
